name: SLSA Provenance

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Explicit top-level permission reset — all jobs start with no permissions.
# Each job grants only what it needs (principle of least privilege).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: pip install build && python -m build

      - name: Compute SHA-256 hashes (base64-encoded for SLSA)
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  provenance:
    needs: [build]
    permissions:
      actions: read       # required to read the workflow run
      id-token: write     # required for OIDC token (non-forgeable identity)
      contents: write     # required to upload provenance to GitHub Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      # Attach the .intoto.jsonl provenance file to the GitHub Release automatically.
      upload-assets: true
