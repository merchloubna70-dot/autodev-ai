name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup autodev
        uses: ./.github/actions/setup-autodev
        with:
          python-version: "3.12"
          extra-packages: mypy

      - name: ruff check
        run: ruff check src tests scripts

      - name: mypy
        run: mypy src/autodev --ignore-missing-imports --no-strict-optional

      - name: pytest with coverage
        run: pytest tests/ --cov=src/autodev --cov-report=json --cov-report=term -q

      - name: coverage gate
        run: python scripts/coverage_gate.py --strict
