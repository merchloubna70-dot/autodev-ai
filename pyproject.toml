[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "crewai-multicli-software-factory"
version = "0.1.0"
description = "CrewAI + Codex CLI + Claude Code CLI multi-CLI software factory for issue-to-delivery and project-from-scratch delivery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Software Factory" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3.0",
    "typer[all]>=0.9",
    "rich>=13.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
crewai = ["crewai>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
crewai-factory = "crewai_multicli_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_multicli_factory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
