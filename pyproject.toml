[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "autodev-ai"
version = "0.1.0a4"
description = "AI-driven software factory: CrewAI + Codex CLI + Claude Code CLI with multi-CLI router, A2A roundtable, MCP server, scale-adaptive delivery from brief to release-ready project."
keywords = ["ai", "agent", "codex", "claude", "crewai", "a2a", "mcp", "software-factory"]
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Software Factory" }]
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.5,<3.0",
    # typer >= 0.12 dropped the [all] extra (rich + shellingham are bundled directly).
    # Pin >=0.12 to avoid the legacy [all] resolution warning and keep behavior stable.
    "typer>=0.12",
    "rich>=13.7",  # explicit even though typer bundles it; we use rich directly
    "shellingham>=1.5",  # explicit; was implied via typer[all]
    "PyYAML>=6.0",
    "jinja2>=3.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/merchloubna70-dot/autodev-ai"
Repository = "https://github.com/merchloubna70-dot/autodev-ai"
Issues = "https://github.com/merchloubna70-dot/autodev-ai/issues"
Changelog = "https://github.com/merchloubna70-dot/autodev-ai/blob/main/CHANGELOG.md"
Documentation = "https://github.com/merchloubna70-dot/autodev-ai/blob/main/README.md"

[project.optional-dependencies]
crewai = ["crewai>=0.30"]
tui = ["textual>=0.60"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.5",
    'tomli>=2.0; python_version < "3.11"',  # tomllib stdlib backport for py3.10
]

[project.scripts]
autodev = "autodev.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end integration tests (slower)",
    "skip_if_no_dist: skip if dist/*.whl is not present",
]
filterwarnings = [
    # pydantic_ai's AgentSpec uses model_ prefixed fields; suppress the UserWarning
    # that originates from the pydantic_ai system package's internal AgentSpec class.
    "ignore:Field \"model_settings\" in AgentSpec has conflict with protected namespace:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF003", "RUF012", "RUF100"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
